name: Validate Repo

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate skill repository
        shell: pwsh
        run: .\scripts\validate-repo.ps1 -Strict
